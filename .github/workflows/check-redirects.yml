name: Check redirects

on:
  pull_request:
    branches: [next, main]
    paths:
      - 'nginx/**'
      - 'content/**'
      - 'config/openapi.json'
      - 'scripts/check-redirects.mjs'
      - 'scripts/fixtures/**'
      - '.github/workflows/check-redirects.yml'

permissions:
  contents: read

jobs:
  redirects:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags --depth=1 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      # Replays legacy URLs and every page that exists on the base branch but not in this PR.
      - name: Check redirects
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-redirects.mjs --base "origin/${BASE_REF}"

      - name: Validate nginx config syntax
        run: |
          docker run --rm \
            -v "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/nginx/redirects.conf:/etc/nginx/conf.d/redirects.conf:ro" \
            nginxinc/nginx-unprivileged:1.30.1-alpine-slim nginx -t
