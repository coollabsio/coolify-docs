name: Production Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  GITHUB_REGISTRY: ghcr.io
  IMAGE_NAME: coollabsio/coolify-docs
  VITE_ANALYTICS_DOMAIN: coolify.io/docs
  VITE_SITE_URL: https://coolify.io/docs/
  # Discord users to mention when the build fails. Keep this list in sync with
  # merge-forward.yml. The webhook URL is the repository secret
  # DISCORD_WEBHOOK_ALERT_MAINTAINERS; without it, no alert is sent.
  DISCORD_USER_IDS: >-
    181775064302223360
    589480400850780170

jobs:
  build-push:
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ${{ env.GITHUB_REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GITHUB_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            VITE_ANALYTICS_DOMAIN=${{ env.VITE_ANALYTICS_DOMAIN }}
            VITE_SITE_URL=${{ env.VITE_SITE_URL }}
          push: true
          tags: |
            ${{ env.GITHUB_REGISTRY }}/${{ env.IMAGE_NAME }}:latest-${{ matrix.arch }}
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.arch }}

  merge-manifest:
    runs-on: ubuntu-24.04
    needs: build-push
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to ${{ env.GITHUB_REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GITHUB_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create & publish manifest on ${{ env.GITHUB_REGISTRY }}
        run: |
          docker buildx imagetools create \
          ${{ env.GITHUB_REGISTRY }}/${{ env.IMAGE_NAME }}:latest-amd64 \
          ${{ env.GITHUB_REGISTRY }}/${{ env.IMAGE_NAME }}:latest-aarch64 \
          --tag ${{ env.GITHUB_REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Coolify
        run: |
          curl --fail --request POST '${{ secrets.COOLIFY_WEBHOOK }}' --header 'Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}'

  # Alert on Discord when building, publishing or deploying the docs fails.
  alert:
    name: Alert on Discord
    runs-on: ubuntu-24.04
    needs: [build-push, merge-manifest]
    if: failure()
    permissions: {}
    steps:
      - name: Alert on Discord
        shell: bash
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_ALERT_MAINTAINERS }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ -z "${WEBHOOK:-}" ]]; then
            echo "::notice::DISCORD_WEBHOOK_ALERT_MAINTAINERS is not set, so no Discord alert was sent."
            exit 0
          fi
          subject="${COMMIT_MESSAGE%%$'\n'*}"
          mentions="$(for id in $DISCORD_USER_IDS; do printf '<@%s> ' "$id"; done)"
          content="${mentions}The production build of coolify-docs failed on \`$REF\` at \`${SHA:0:7}\`${subject:+ ($subject)}: $RUN_URL"
          jq -n --arg content "${content:0:1990}" --arg ids "$DISCORD_USER_IDS" \
            '{content: $content, allowed_mentions: {parse: [], users: ($ids | split(" ") | map(select(test("^[0-9]+$"))))}}' |
            curl -fsS -X POST -H 'Content-Type: application/json' --data @- "$WEBHOOK" > /dev/null
          echo "Sent the Discord alert."
