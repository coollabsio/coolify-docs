<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found | Coolify Docs</title>
    <meta name="description" content="This Coolify documentation page does not exist." />
    <meta name="robots" content="noindex" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #07070a;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #6b16ed;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      main {
        max-width: 36rem;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 2rem;
      }
      p {
        margin: 0 0 1.5rem;
        color: var(--muted);
        line-height: 1.6;
      }
      a {
        color: #fff;
        background: var(--accent);
        text-decoration: none;
        border-radius: 0.5rem;
        padding: 0.7rem 1.1rem;
        font-weight: 600;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>This documentation URL does not exist. It may have been moved or the link is outdated.</p>
      <a href="/docs">Back to Coolify Docs</a>
    </main>
  </body>
</html>
