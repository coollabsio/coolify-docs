# Docs redirects, included in the server block of nginx.conf before the page locations.
#
# Production and next.coolify.io strip the /docs prefix before nginx sees the request; a local
# `docker run` of the image does not. Write every rule as
#   location ~ ^(?:/docs)?/old/path/?$ { return 301 "/docs/new/path"; }
# so it matches both. Targets are browser-facing and always start with /docs.
#
# Regex rules are tried in file order and the first match wins: keep specific rules above the
# catch-alls at the end of this file. Never add a rule whose path is a real page.
# Run `node scripts/check-redirects.mjs` after editing.

# Redirects for Core proxy -> Core networking proxy
location ~ ^(?:/docs)?/core/proxy/?$ { return 301 "/docs/core/networking/proxy/overview"; }
location ~ ^(?:/docs)?/core/proxy/traefik/?$ { return 301 "/docs/core/networking/proxy/traefik/overview"; }
location ~ ^(?:/docs)?/core/proxy/caddy/?$ { return 301 "/docs/core/networking/proxy/caddy/overview"; }

